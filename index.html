<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tideline Shells | Collector Specimen Shells, New Zealand</title>
  <meta name="description" content="Collector-grade specimen shells, sorted by type and size, shipped from New Zealand.">
  <link rel="icon" href="assets/img/placeholder.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">

  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">Specimen shells &middot; Aotearoa New Zealand</p>
      <h1>Collector shells,<br>chosen one by one.</h1>
      <p class="lead">Carefully chosen and measured. Browse by type or size, request your order, and we'll confirm stock before you pay.</p>
      <p><a class="btn" href="#catalog">Browse the collection</a> &nbsp; <a class="btn btn-ghost" href="how-to-order.html">How ordering works</a></p>
    </div>
  </section>

  <main class="catalog" id="catalog">
    <div class="wrap">
      <h2>The collection</h2>
      <div class="filters">
        <label class="field">Search
          <input id="f-search" type="search" placeholder="Name, type or scientific name…">
        </label>
        <label class="field">Type
          <select id="f-type"></select>
        </label>
        <label class="field">Size
          <select id="f-size">
            <option value="">Any size</option>
            <option value="0-30">Under 30 mm</option>
            <option value="30-60">30–60 mm</option>
            <option value="60-100">60–100 mm</option>
            <option value="100-9999">Over 100 mm</option>
          </select>
        </label>
        <label class="field">Sort by
          <select id="f-sort">
            <option value="name">Name A–Z</option>
            <option value="type">Type</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="size-asc">Size: small to large</option>
            <option value="size-desc">Size: large to small</option>
          </select>
        </label>
      </div>
      <label class="check" style="margin-bottom:16px"><input id="f-instock" type="checkbox"> Hide sold-out species</label>
      <p class="result-count" id="result-count"></p>
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <script src="data/config.js"></script>
  <script src="data/shells.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
